<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Champion Dashboard — GripTape Learning Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #001722;
      --bg2:    #0a2230;
      --border: rgba(255,255,255,0.07);
      --orange: #EA5329;
      --amber:  #F79227;
      --white:  #F5F5F0;
      --gray:   rgba(255,255,255,0.5);
      --muted:  rgba(255,255,255,0.25);
      --red:    #EA5329;
      --green:  #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      margin: 0;
      padding: 0;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 1.5rem 64px;
    }

    /* ── States ── */
    #state-loading,
    #state-invalid,
    #state-dashboard { display: none; }

    .state-center {
      text-align: center;
      padding: 80px 1.5rem;
      max-width: 680px;
      margin: 0 auto;
    }

    .state-logo {
      height: 22px;
      display: block;
      margin: 0 auto 28px;
    }

    .state-muted {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .invalid-heading {
      font-family: 'Anton', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--white);
      margin: 0 0 10px;
    }

    .invalid-sub {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
      margin: 0;
    }

    /* ── Header ── */
    .page-logo {
      display: block;
      margin: 0 auto 8px;
      height: 48px;
    }

    .page-logo-label {
      display: block;
      text-align: center;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0 28px;
    }

    .welcome-heading {
      font-family: 'Anton', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--orange);
      line-height: 1.1;
      margin: 0 0 4px;
    }

    .cohort-label {
      color: var(--gray);
      font-size: 0.9rem;
      margin: 0 0 20px;
    }

    /* ── Stat chips ── */
    .stat-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .stat-chip {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.82rem;
      color: var(--gray);
    }

    .stat-chip strong {
      color: var(--white);
      font-weight: 700;
    }

    .stat-chip.attention strong {
      color: var(--red);
    }

    .stat-chip.attention {
      border-color: rgba(234,83,41,0.3);
      background: rgba(234,83,41,0.06);
    }

    /* ── Orientation link ── */
    .orientation-link-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 28px;
      font-size: 0.82rem;
    }

    .orientation-link-row .link-label {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .orientation-link-row .link-url {
      color: var(--gray);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      font-size: 0.82rem;
    }

    .copy-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: var(--white);
      font-size: 0.75rem;
      padding: 4px 10px;
      cursor: pointer;
      white-space: nowrap;
      font-family: 'DM Sans', sans-serif;
    }

    .copy-btn:hover { border-color: var(--orange); }

    /* ── Cards ── */
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .card.urgent {
      border-color: rgba(234,83,41,0.4);
      background: rgba(234,83,41,0.04);
    }

    .card-banner {
      background: rgba(234,83,41,0.12);
      color: var(--red);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 8px 16px;
      border-bottom: 1px solid rgba(234,83,41,0.2);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      user-select: none;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--white);
      flex-shrink: 0;
    }

    .avatar.urgent {
      background: rgba(234,83,41,0.2);
      color: var(--red);
    }

    .card-name {
      font-weight: 600;
      font-size: 0.95rem;
      flex: 1;
    }

    .status-pill {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 100px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .pill-mentor_pending    { background: rgba(234,83,41,0.15); color: var(--red); }
    .pill-grant_pending     { background: rgba(247,146,39,0.15); color: var(--amber); }
    .pill-grant_approved    { background: rgba(34,197,94,0.15); color: var(--green); }
    .pill-grant_expired     { background: rgba(255,255,255,0.08); color: var(--gray); }
    .pill-final_video_pending { background: rgba(247,146,39,0.15); color: var(--amber); }
    .pill-full_send_review  { background: rgba(34,197,94,0.15); color: var(--green); }

    .chevron {
      color: var(--muted);
      font-size: 0.8rem;
      transition: transform 0.15s;
    }

    .chevron.open { transform: rotate(180deg); }

    .card-body {
      display: none;
      padding: 0 16px 16px;
    }

    .card-body.open { display: block; }

    /* ── Card sections ── */
    .card-section-label {
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 16px 0 8px;
    }

    .profile-row {
      font-size: 0.88rem;
      color: var(--gray);
      line-height: 1.6;
    }

    .profile-row a {
      color: var(--orange);
      text-decoration: none;
    }

    .profile-row a:hover { text-decoration: underline; }

    .deadline-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .deadline-chip {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.78rem;
      color: var(--gray);
    }

    .deadline-chip.warn {
      border-color: rgba(234,83,41,0.3);
      color: var(--red);
      background: rgba(234,83,41,0.06);
    }

    .deadline-chip .dl-label {
      color: var(--muted);
      font-size: 0.7rem;
      display: block;
    }

    /* ── Orientation scheduling ── */
    .orientation-box {
      background: rgba(234,83,41,0.06);
      border: 1px solid rgba(234,83,41,0.2);
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
    }

    .orientation-box .ob-label {
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--red);
      font-weight: 700;
      margin: 0 0 10px;
    }

    .orientation-box .ob-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .orientation-confirmed {
      font-size: 0.85rem;
      color: var(--green);
      font-weight: 600;
    }

    /* ── Unresponsive ── */
    .unresponsive-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
    }

    .unresponsive-row.flagged {
      background: rgba(247,146,39,0.06);
      border-color: rgba(247,146,39,0.25);
    }

    .unresponsive-row input[type="checkbox"] {
      margin-top: 2px;
      width: 16px;
      height: 16px;
      accent-color: var(--amber);
      cursor: pointer;
    }

    .unresponsive-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--white);
    }

    .unresponsive-label.flagged { color: var(--amber); }

    .unresponsive-note {
      font-size: 0.78rem;
      color: var(--muted);
      margin: 2px 0 0;
    }

    .unresponsive-note.flagged { color: var(--amber); }

    /* ── Check-in log ── */
    .checkin-entry {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }

    .checkin-entry .ce-label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--white);
    }

    .checkin-entry .ce-date {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .checkin-entry .ce-notes {
      font-size: 0.85rem;
      color: var(--gray);
      margin-top: 4px;
      line-height: 1.5;
    }

    .no-checkins {
      color: var(--muted);
      font-size: 0.85rem;
      font-style: italic;
    }

    /* ── Add check-in form ── */
    .checkin-form {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field-input,
    .field-textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      line-height: 1.5;
      outline: none;
      transition: border-color 0.15s;
    }

    .field-input:focus,
    .field-textarea:focus {
      border-color: var(--orange);
    }

    .field-textarea {
      min-height: 80px;
      resize: vertical;
    }

    .field-input::placeholder,
    .field-textarea::placeholder {
      color: var(--muted);
    }

    .btn-sm {
      background: var(--orange);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-sm:hover:not(:disabled) { opacity: 0.9; }
    .btn-sm:disabled { opacity: 0.35; cursor: not-allowed; }

    .section-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }

    input[type="date"] {
      cursor: pointer;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .date-wrap {
      position: relative;
      display: inline-block;
    }

    @media (max-width: 480px) {
      .welcome-heading { font-size: 1.4rem; }
      .stat-row { flex-direction: column; }
      .orientation-link-row { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="state-loading" class="state-center">
    <img class="state-logo"
      src="https://cdn.prod.website-files.com/640b7fef2e2b16effc0a7b1e/644b0baddf9bc8c57b2514ca_GripTape_wordmark_white.png"
      alt="GripTape" />
    <p class="state-muted">Loading your dashboard…</p>
  </div>

  <!-- Invalid -->
  <div id="state-invalid" class="state-center">
    <img class="state-logo"
      src="https://cdn.prod.website-files.com/640b7fef2e2b16effc0a7b1e/644b0baddf9bc8c57b2514ca_GripTape_wordmark_white.png"
      alt="GripTape" />
    <p class="invalid-heading">This link is invalid.</p>
    <p class="invalid-sub">If you believe this is a mistake, please contact the GripTape team.</p>
  </div>

  <!-- Dashboard -->
  <div id="state-dashboard" class="page">
    <img class="page-logo"
      src="https://cdn.prod.website-files.com/640b7fef2e2b16effc0a7b1e/644b0baddf9bc8c57b2514ca_GripTape_wordmark_white.png"
      alt="GripTape" />
    <span class="page-logo-label">Learning Challenge · NYC 2026</span>
    <hr class="divider" />

    <h1 class="welcome-heading" id="welcome-heading"></h1>
    <p class="cohort-label">Cohort 01 — NYC Learning Challenge</p>

    <div class="stat-row" id="stat-row"></div>
    <div class="orientation-link-row" id="orientation-link-row" style="display:none;">
      <span class="link-label">Orientation form</span>
      <span class="link-url" id="orientation-url"></span>
      <button class="copy-btn" id="copy-orientation-btn">Copy</button>
    </div>

    <div id="cards-container"></div>
  </div>

  <script>
    var TOKEN = new URLSearchParams(window.location.search).get('token');
    var CHAMPION_NAME = '';
    var CHAMPION_TOKEN = '';

    var STATUS_LABELS = {
      mentor_pending: 'Orientation',
      grant_pending: 'Grant pending',
      grant_approved: 'Active',
      grant_expired: 'Grant expired',
      final_video_pending: 'Full Send',
      full_send_review: 'Under review',
    };

    function showState(id) {
      ['state-loading', 'state-invalid', 'state-dashboard'].forEach(function(s) {
        document.getElementById(s).style.display = (s === id) ? 'block' : 'none';
      });
    }

    function daysLeft(fromDate, totalDays) {
      if (!fromDate) return null;
      var entered = new Date(fromDate);
      var deadline = new Date(entered.getTime() + totalDays * 24 * 60 * 60 * 1000);
      var now = new Date();
      var diff = Math.ceil((deadline - now) / (24 * 60 * 60 * 1000));
      return diff;
    }

    function formatDate(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function deadlineDate(fromDate, totalDays) {
      if (!fromDate) return '';
      var d = new Date(new Date(fromDate).getTime() + totalDays * 24 * 60 * 60 * 1000);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function getInitials(first, last) {
      return ((first || '')[0] || '') + ((last || '')[0] || '');
    }

    function buildDeadlineChips(y) {
      var chips = [];
      if (y.status === 'mentor_pending') {
        var dl = daysLeft(y.stage_entered_at, 8);
        chips.push({ label: 'Orientation', days: dl, warn: dl !== null && dl <= 3, date: deadlineDate(y.stage_entered_at, 8) });
      }
      if (y.status === 'grant_pending') {
        var dl2 = daysLeft(y.stage_entered_at, 11);
        chips.push({ label: 'Grant docs', days: dl2, warn: dl2 !== null && dl2 <= 3, date: deadlineDate(y.stage_entered_at, 11) });
      }
      if (y.status === 'grant_approved' || y.status === 'grant_expired') {
        var dl3 = daysLeft(y.accepted_at, 42);
        chips.push({ label: 'Full Send', days: dl3, warn: dl3 !== null && dl3 <= 5, date: deadlineDate(y.accepted_at, 42) });
        chips.push({ label: 'End of Challenge', days: dl3, warn: dl3 !== null && dl3 <= 5, date: deadlineDate(y.accepted_at, 42) });
      }
      if (y.status === 'final_video_pending') {
        var dl4 = daysLeft(y.stage_entered_at, 14);
        chips.push({ label: 'Full Send', days: dl4, warn: dl4 !== null && dl4 <= 5, date: deadlineDate(y.stage_entered_at, 14) });
        chips.push({ label: 'End of Challenge', days: dl4, warn: dl4 !== null && dl4 <= 5, date: deadlineDate(y.stage_entered_at, 14) });
      }
      return chips;
    }

    function renderCard(y) {
      var isUrgent = y.status === 'mentor_pending';
      var fullName = (y.first_name || '') + ' ' + (y.last_name || '');
      var checkins = (y.checkins || []).filter(function(c) { return c.type === 'checkin'; });
      var orientationCheckin = (y.checkins || []).find(function(c) { return c.type === 'orientation_scheduled'; });
      var unresponsiveCheckin = (y.checkins || []).find(function(c) { return c.type === 'unresponsive'; });
      var chips = buildDeadlineChips(y);

      var card = document.createElement('div');
      card.className = 'card' + (isUrgent ? ' urgent' : '');

      // Banner
      if (isUrgent) {
        var dl = daysLeft(y.stage_entered_at, 8);
        var banner = document.createElement('div');
        banner.className = 'card-banner';
        banner.textContent = 'Orientation not yet scheduled — ' + (dl !== null && dl > 0 ? dl + ' day' + (dl !== 1 ? 's' : '') + ' left' : 'overdue');
        card.appendChild(banner);
      }

      // Header
      var header = document.createElement('div');
      header.className = 'card-header';

      var avatar = document.createElement('div');
      avatar.className = 'avatar' + (isUrgent ? ' urgent' : '');
      avatar.textContent = getInitials(y.first_name, y.last_name);

      var nameSpan = document.createElement('span');
      nameSpan.className = 'card-name';
      nameSpan.textContent = fullName;

      var pill = document.createElement('span');
      pill.className = 'status-pill pill-' + y.status;
      pill.textContent = STATUS_LABELS[y.status] || y.status;

      var chevron = document.createElement('span');
      chevron.className = 'chevron';
      chevron.innerHTML = '&#9660;';

      header.appendChild(avatar);
      header.appendChild(nameSpan);
      header.appendChild(pill);
      header.appendChild(chevron);
      card.appendChild(header);

      // Body
      var body = document.createElement('div');
      body.className = 'card-body';

      // Profile
      var profileLabel = document.createElement('div');
      profileLabel.className = 'card-section-label';
      profileLabel.textContent = 'Profile';
      body.appendChild(profileLabel);

      var profileRow = document.createElement('div');
      profileRow.className = 'profile-row';
      var passionText = y.passion ? y.passion : 'Not available';
      var profileHtml = '<strong>Passion:</strong> ' + escapeHtml(passionText);
      if (y.first_drop_url) {
        profileHtml += '<br><a href="' + escapeHtml(y.first_drop_url) + '" target="_blank">Watch First Drop →</a>';
      }
      profileRow.innerHTML = profileHtml;
      body.appendChild(profileRow);

      // Deadlines
      if (chips.length > 0) {
        var dlLabel = document.createElement('div');
        dlLabel.className = 'card-section-label';
        dlLabel.textContent = 'Deadlines';
        body.appendChild(dlLabel);

        var dlRow = document.createElement('div');
        dlRow.className = 'deadline-chips';
        chips.forEach(function(c) {
          var chip = document.createElement('div');
          chip.className = 'deadline-chip' + (c.warn ? ' warn' : '');
          var daysText = c.days !== null && c.days > 0 ? c.days + 'd left' : (c.days !== null ? 'overdue' : '');
          chip.innerHTML = '<span class="dl-label">' + escapeHtml(c.label) + '</span>' + escapeHtml(c.date) + (daysText ? ' · ' + daysText : '');
          dlRow.appendChild(chip);
        });
        body.appendChild(dlRow);
      }

      // Orientation scheduling (mentor_pending only)
      if (isUrgent) {
        var obBox = document.createElement('div');
        obBox.className = 'orientation-box';

        var obLabel = document.createElement('p');
        obLabel.className = 'ob-label';
        obLabel.textContent = 'Schedule orientation call';
        obBox.appendChild(obLabel);

        if (orientationCheckin) {
          var confirmed = document.createElement('div');
          confirmed.className = 'orientation-confirmed';
          confirmed.textContent = '✓ Scheduled for ' + formatDate(orientationCheckin.call_date);
          obBox.appendChild(confirmed);
        } else {
          var obRow = document.createElement('div');
          obRow.className = 'ob-row';
          var dateWrap = document.createElement('div');
          dateWrap.className = 'date-wrap';
          var dateInput = document.createElement('input');
          dateInput.type = 'date';
          dateInput.className = 'field-input';
          dateInput.style.maxWidth = '180px';
          dateInput.style.cursor = 'pointer';
          dateWrap.appendChild(dateInput);
          var saveBtn = document.createElement('button');
          saveBtn.className = 'btn-sm';
          saveBtn.textContent = 'Save date';
          saveBtn.disabled = true;
          dateInput.addEventListener('input', function() { saveBtn.disabled = !dateInput.value; });

          saveBtn.addEventListener('click', function() {
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving…';
            fetch('/api/champion-log-checkin', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                token: TOKEN,
                youth_id: y.id,
                type: 'orientation_scheduled',
                call_date: dateInput.value,
                note: 'Orientation call scheduled',
                youth_name: fullName,
                champion_name: CHAMPION_NAME,
              }),
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
              if (data.success) {
                obRow.innerHTML = '';
                var conf = document.createElement('div');
                conf.className = 'orientation-confirmed';
                conf.textContent = '✓ Scheduled for ' + formatDate(dateInput.value);
                obBox.appendChild(conf);
              } else {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save date';
              }
            })
            .catch(function() {
              saveBtn.disabled = false;
              saveBtn.textContent = 'Save date';
            });
          });

          obRow.appendChild(dateWrap);
          obRow.appendChild(saveBtn);
          obBox.appendChild(obRow);
        }

        body.appendChild(obBox);
      }

      // Unresponsive
      body.appendChild(buildUnresponsiveRow(y, fullName, unresponsiveCheckin));

      // Check-in log
      var logSep = document.createElement('hr');
      logSep.className = 'section-divider';
      body.appendChild(logSep);

      var logLabel = document.createElement('div');
      logLabel.className = 'card-section-label';
      logLabel.textContent = 'Check-in log';
      body.appendChild(logLabel);

      var logContainer = document.createElement('div');
      logContainer.id = 'log-' + y.id;
      if (checkins.length === 0) {
        var noLogs = document.createElement('p');
        noLogs.className = 'no-checkins';
        noLogs.textContent = 'No calls logged yet.';
        logContainer.appendChild(noLogs);
      } else {
        checkins.forEach(function(c) {
          logContainer.appendChild(buildCheckinEntry(c));
        });
      }
      body.appendChild(logContainer);

      // Add check-in form
      body.appendChild(buildCheckinForm(y, fullName, logContainer));

      card.appendChild(body);

      // Toggle
      header.addEventListener('click', function() {
        var isOpen = body.classList.toggle('open');
        chevron.classList.toggle('open', isOpen);
      });

      return card;
    }

    function buildCheckinEntry(c) {
      var entry = document.createElement('div');
      entry.className = 'checkin-entry';
      entry.innerHTML = '<div class="ce-label">' + escapeHtml(c.note || 'Check-in') + '</div>'
        + '<div class="ce-date">' + formatDate(c.call_date) + '</div>';
      return entry;
    }

    function buildUnresponsiveRow(y, fullName, existing) {
      var row = document.createElement('div');
      row.className = 'unresponsive-row' + (existing ? ' flagged' : '');

      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!existing;
      cb.disabled = !!existing;

      var textWrap = document.createElement('div');
      var label = document.createElement('div');
      label.className = 'unresponsive-label' + (existing ? ' flagged' : '');
      label.textContent = existing ? 'Flagged as unresponsive' : 'Mark as unresponsive';

      var note = document.createElement('div');
      note.className = 'unresponsive-note' + (existing ? ' flagged' : '');
      note.textContent = existing ? 'GripTape has been notified' : 'GripTape will be notified';

      textWrap.appendChild(label);
      textWrap.appendChild(note);
      row.appendChild(cb);
      row.appendChild(textWrap);

      if (!existing) {
        cb.addEventListener('change', function() {
          if (!cb.checked) return;
          cb.disabled = true;
          fetch('/api/champion-flag-unresponsive', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              token: TOKEN,
              youth_id: y.id,
              youth_name: fullName,
              champion_name: CHAMPION_NAME,
            }),
          })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.success) {
              row.classList.add('flagged');
              label.classList.add('flagged');
              label.textContent = 'Flagged as unresponsive';
              note.classList.add('flagged');
              note.textContent = 'GripTape has been notified';
            } else {
              cb.checked = false;
              cb.disabled = false;
            }
          })
          .catch(function() {
            cb.checked = false;
            cb.disabled = false;
          });
        });
      }

      return row;
    }

    function buildCheckinForm(y, fullName, logContainer) {
      var form = document.createElement('div');
      form.className = 'checkin-form';

      var formLabel = document.createElement('div');
      formLabel.className = 'card-section-label';
      formLabel.textContent = 'Add check-in';
      form.appendChild(formLabel);

      var dateWrap2 = document.createElement('div');
      dateWrap2.className = 'date-wrap';
      dateWrap2.style.width = '100%';
      var dateInput = document.createElement('input');
      dateInput.type = 'date';
      dateInput.className = 'field-input';
      dateInput.placeholder = 'Call date';
      dateInput.style.cursor = 'pointer';
      dateWrap2.appendChild(dateInput);
      form.appendChild(dateWrap2);

      var labelInput = document.createElement('input');
      labelInput.type = 'text';
      labelInput.className = 'field-input';
      labelInput.placeholder = 'e.g. Week 1 check-in';
      form.appendChild(labelInput);

      var notesInput = document.createElement('textarea');
      notesInput.className = 'field-textarea';
      notesInput.placeholder = 'Notes from the call';
      form.appendChild(notesInput);

      var logBtn = document.createElement('button');
      logBtn.className = 'btn-sm';
      logBtn.textContent = 'Log call';
      logBtn.disabled = true;
      logBtn.style.alignSelf = 'flex-start';
      form.appendChild(logBtn);

      function checkValid() {
        logBtn.disabled = !(dateInput.value && labelInput.value.trim() && notesInput.value.trim());
      }
      dateInput.addEventListener('input', checkValid);
      labelInput.addEventListener('input', checkValid);
      notesInput.addEventListener('input', checkValid);

      logBtn.addEventListener('click', function() {
        logBtn.disabled = true;
        logBtn.textContent = 'Logging…';
        var noteText = labelInput.value.trim() + ' — ' + notesInput.value.trim();

        fetch('/api/champion-log-checkin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: TOKEN,
            youth_id: y.id,
            type: 'checkin',
            call_date: dateInput.value,
            note: noteText,
            youth_name: fullName,
            champion_name: CHAMPION_NAME,
          }),
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            // Remove "no calls" message if present
            var noMsg = logContainer.querySelector('.no-checkins');
            if (noMsg) noMsg.remove();

            logContainer.appendChild(buildCheckinEntry({
              note: noteText,
              call_date: dateInput.value,
            }));

            dateInput.value = '';
            labelInput.value = '';
            notesInput.value = '';
            logBtn.textContent = 'Log call';
            logBtn.disabled = true;
          } else {
            logBtn.textContent = 'Log call';
            checkValid();
          }
        })
        .catch(function() {
          logBtn.textContent = 'Log call';
          checkValid();
        });
      });

      return form;
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str || ''));
      return div.innerHTML;
    }

    async function init() {
      showState('state-loading');

      if (!TOKEN) {
        showState('state-invalid');
        return;
      }

      try {
        var enc = encodeURIComponent(TOKEN);
        var responses = await Promise.all([
          fetch('/api/check-champion-token?token=' + enc),
          fetch('/api/champion-youth-list?token=' + enc),
        ]);

        var tokenData = await responses[0].json();
        var youthData = await responses[1].json();

        if (!tokenData.valid || !youthData.valid) {
          showState('state-invalid');
          return;
        }

        CHAMPION_NAME = tokenData.first_name;
        CHAMPION_TOKEN = tokenData.champion_token;

        document.getElementById('welcome-heading').textContent = 'Welcome back, ' + tokenData.first_name;

        // Stats
        var youth = youthData.youth || [];
        var needsAttention = youth.filter(function(y) { return y.status === 'mentor_pending'; }).length;
        var statRow = document.getElementById('stat-row');

        var totalChip = document.createElement('div');
        totalChip.className = 'stat-chip';
        totalChip.innerHTML = '<strong>' + youth.length + '</strong> Challenger' + (youth.length !== 1 ? 's' : '');
        statRow.appendChild(totalChip);

        if (needsAttention > 0) {
          var attentionChip = document.createElement('div');
          attentionChip.className = 'stat-chip attention';
          attentionChip.innerHTML = '<strong>' + needsAttention + '</strong> needs attention';
          statRow.appendChild(attentionChip);
        }

        // Orientation link
        if (CHAMPION_TOKEN) {
          var linkRow = document.getElementById('orientation-link-row');
          linkRow.style.display = '';
          var url = 'thelearningchallenge.org/orientation?token=' + CHAMPION_TOKEN;
          document.getElementById('orientation-url').textContent = url;
          document.getElementById('copy-orientation-btn').addEventListener('click', function() {
            navigator.clipboard.writeText('https://' + url).then(function() {
              var btn = document.getElementById('copy-orientation-btn');
              btn.textContent = 'Copied';
              setTimeout(function() { btn.textContent = 'Copy'; }, 1500);
            });
          });
        }

        // Cards
        var container = document.getElementById('cards-container');
        youth.forEach(function(y) {
          container.appendChild(renderCard(y));
        });

        showState('state-dashboard');

      } catch (err) {
        console.error('[champion-dashboard] init error:', err);
        showState('state-invalid');
      }
    }

    init();
  </script>
</body>
</html>
