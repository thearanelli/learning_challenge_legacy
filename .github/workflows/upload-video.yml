name: Upload video to GripTape YouTube

on:
  workflow_dispatch:
    inputs:
      supabase_storage_path:
        description: 'Path in Supabase Storage videos bucket'
        required: true
      youth_id:
        description: 'Youth ID to update first_drop_url on'
        required: true
      application_id:
        description: 'Application ID to update video_url on'
        required: true
      title:
        description: 'Video title'
        required: true
        default: 'GripTape First Drop'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          pip install google-auth google-auth-httplib2 google-api-python-client requests

      - name: Download, upload, and cleanup
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_STORAGE_PATH: ${{ inputs.supabase_storage_path }}
          YOUTH_ID: ${{ inputs.youth_id }}
          APPLICATION_ID: ${{ inputs.application_id }}
          VIDEO_TITLE: ${{ inputs.title }}
        run: |
          python3 - <<'EOF'
          import os, requests
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          supabase_url = os.environ['SUPABASE_URL']
          supabase_key = os.environ['SUPABASE_SERVICE_KEY']
          storage_path = os.environ['SUPABASE_STORAGE_PATH']
          youth_id = os.environ['YOUTH_ID']
          application_id = os.environ['APPLICATION_ID']
          title = os.environ['VIDEO_TITLE']

          sb_headers = {
            'apikey': supabase_key,
            'Authorization': f'Bearer {supabase_key}'
          }

          # Download file from Supabase Storage
          tmp_path = '/tmp/first_drop.mp4'
          print(f'Downloading from Supabase Storage: videos/{storage_path}')
          response = requests.get(
            f'{supabase_url}/storage/v1/object/videos/{storage_path}',
            headers=sb_headers
          )
          response.raise_for_status()
          with open(tmp_path, 'wb') as f:
            f.write(response.content)
          print(f'Downloaded {len(response.content)} bytes')

          # Auth with YouTube
          creds = Credentials(
            token=None,
            refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],
            client_id=os.environ['YOUTUBE_CLIENT_ID'],
            client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],
            token_uri='https://oauth2.googleapis.com/token'
          )
          youtube = build('youtube', 'v3', credentials=creds)

          # Upload to GripTape YouTube channel
          body = {
            'snippet': {
              'title': title,
              'description': 'GripTape Learning Challenge — First Drop submission.',
              'tags': ['GripTape', 'Learning Challenge'],
              'categoryId': '22'
            },
            'status': {
              'privacyStatus': 'unlisted'
            }
          }
          media = MediaFileUpload(tmp_path, mimetype='video/mp4', resumable=True)
          yt_response = youtube.videos().insert(
            part='snippet,status',
            body=body,
            media_body=media
          ).execute()

          video_id = yt_response['id']
          griptape_url = f'https://www.youtube.com/watch?v={video_id}'
          print(f'Uploaded: {griptape_url}')

          # Delete temp file from Supabase Storage
          print(f'Deleting from Supabase Storage: videos/{storage_path}')
          del_response = requests.delete(
            f'{supabase_url}/storage/v1/object/videos/{storage_path}',
            headers=sb_headers
          )
          print(f'Delete status: {del_response.status_code}')

          # Update youth.first_drop_url with GripTape YouTube URL
          requests.patch(
            f'{supabase_url}/rest/v1/youth?id=eq.{youth_id}',
            headers={**sb_headers, 'Content-Type': 'application/json'},
            json={'first_drop_url': griptape_url}
          )

          # Update applications.video_url too
          requests.patch(
            f'{supabase_url}/rest/v1/applications?id=eq.{application_id}',
            headers={**sb_headers, 'Content-Type': 'application/json'},
            json={'video_url': griptape_url}
          )

          print('Done — first_drop_url and video_url updated.')
          EOF
