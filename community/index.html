<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community — The Learning Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --orange: #EA5329;
  --orange-light: #e85d26;
  --bg: #001722;
  --bg2: #161616;
  --white: #F5F5F0;
  --gray: #777;
  --border: rgba(255,255,255,0.08);
  --pill-bg: #fff3ee;
  --pill-text: #c44e17;
}

html { scroll-behavior: smooth; }
body {
  font-family: 'Instrument Sans', sans-serif;
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
}

/* NAV */
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.5rem 2.5rem;
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(0,23,34,0.85);
}
.logo {
  font-family: 'Anton', sans-serif;
  font-weight: 800;
  font-size: 1.1rem;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.logo a { text-decoration: none; }
.nav-links { display: flex; gap: 1.25rem; align-items: center; }
.nav-links a {
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--gray);
  text-decoration: none;
  transition: color 0.2s;
}
.nav-links a:hover { color: var(--white); }

/* HERO */
.hero {
  text-align: center;
  padding: 4rem 1.5rem 2.5rem;
}
.hero .eyebrow {
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--orange);
  font-weight: 500;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.hero h1 {
  font-family: 'Anton', sans-serif;
  font-weight: 800;
  font-size: clamp(2rem, 6vw, 3.2rem);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-bottom: 0.75rem;
}
.hero .subtitle {
  font-size: 1.05rem;
  color: var(--gray);
  line-height: 1.5;
}
.hero .count-line {
  font-size: 0.85rem;
  color: var(--gray);
  margin-top: 0.5rem;
}
.hero .count-line .count { color: var(--orange); font-weight: 600; }

/* GRID */
.grid-wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 1.5rem 4rem;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 180px));
  justify-content: center;
  gap: 16px;
}

/* CARD */
.card {
  background: var(--bg2);
  border-radius: 12px;
  overflow: hidden;
  border: 1.5px solid rgba(234,83,41,0.35);
  transition: transform 0.2s, box-shadow 0.2s;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.card.is-me {
  border: 2px solid var(--orange);
}

/* VIDEO AREA */
.card-video {
  position: relative;
  width: 100%;
  padding-top: 177.78%;
  background: var(--bg);
  overflow: hidden;
}
.card-video img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
}
.card-video .play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.92);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.card-video .play-btn::after {
  content: '';
  display: block;
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 7px 0 7px 13px;
  border-color: transparent transparent transparent var(--bg);
  margin-left: 2px;
}
.cohort-chip {
  position: absolute;
  top: 8px;
  left: 8px;
  background: var(--orange);
  color: #fff;
  font-family: 'Anton', sans-serif;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 5px;
  letter-spacing: 0.06em;
  z-index: 2;
}
/* CARD BODY */
.card-body {
  padding: 10px 12px 12px;
}
.card-name {
  font-family: 'Anton', sans-serif;
  font-size: 15px;
  color: var(--white);
  text-transform: uppercase;
  letter-spacing: 0.01em;
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-passion {
  font-size: 12px;
  color: var(--orange);
  font-weight: 500;
  text-transform: uppercase;
  margin-bottom: 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-location {
  font-size: 11px;
  color: var(--gray);
  margin-bottom: 6px;
}
.card-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.card-location::before {
  content: '📍';
  margin-right: 3px;
  font-size: 10px;
}
.card-champion {
  font-size: 10px;
  font-weight: 500;
  color: var(--pill-text);
  background: var(--pill-bg);
  padding: 3px 8px;
  border-radius: 100px;
  white-space: nowrap;
  flex-shrink: 0;
}
.card-number {
  font-size: 10px;
  color: var(--gray);
  margin-left: auto;
  white-space: nowrap;
}

/* GHOST CARD (+1) */
.card.ghost-card {
  background: transparent;
  border: 2px dashed var(--orange);
}
.card.ghost-card:hover {
  transform: none;
  box-shadow: none;
}
.ghost-video {
  position: relative;
  width: 100%;
  padding-top: 177.78%;
}
.ghost-video-inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  text-align: center;
}
.ghost-plus {
  font-family: 'Anton', sans-serif;
  font-size: 40px;
  color: var(--orange);
  line-height: 1;
  margin-bottom: 8px;
}
.ghost-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--white);
  margin-bottom: 6px;
}
.ghost-desc {
  font-size: 11px;
  color: var(--gray);
  line-height: 1.4;
}
.ghost-body {
  padding: 10px 12px 12px;
}
.ghost-btn {
  width: 100%;
  background: var(--orange);
  color: #fff;
  border-radius: 8px;
  padding: 8px;
  font-weight: 600;
  font-size: 13px;
  border: none;
  cursor: pointer;
  font-family: inherit;
}

/* EMPTY / ERROR */
.msg-center {
  text-align: center;
  padding: 4rem 1.5rem;
  color: var(--gray);
  font-size: 1rem;
}

@media (max-width: 500px) {
  nav { padding: 1rem 1.25rem; }
  .hero { padding: 2.5rem 1.25rem 1.5rem; }
  .grid-wrap { padding: 0 1rem 3rem; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
}
</style>
</head>
<body>

<nav>
  <div class="logo">
    <a href="/">
      <img src="https://cdn.prod.website-files.com/640b7fef2e2b16effc0a7b1e/644b0baddf9bc8c57b2514ca_GripTape_wordmark_white.png" alt="GripTape" style="height:28px;">
    </a>
  </div>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/profile" id="nav-profile">My Profile</a>
  </div>
</nav>

<section class="hero">
  <p class="eyebrow">Summer 2026 &middot; Cohort 01</p>
  <h1>Challengers only.</h1>
  <p class="subtitle" id="subtitle">Everyone here earned their spot. This is who you're in it with.</p>
  <p class="count-line" id="count"></p>
</section>

<div class="grid-wrap">
  <div class="grid" id="grid"></div>
  <div class="msg-center" id="msg" style="display:none;"></div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');

  // Update profile nav link
  if (token) {
    document.getElementById('nav-profile').href = '/profile?token=' + encodeURIComponent(token);
  }

  fetch('/api/community')
    .then(function(r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(function(challengers) {
      if (!challengers.length) {
        showMsg('Challengers will appear here once they complete their orientation call.');
        return;
      }

      document.getElementById('count').innerHTML =
        '<span class="count">' + challengers.length + '</span> Challengers &middot; Summer 2026';

      // Move viewer's card to front
      if (token) {
        var meIdx = -1;
        for (var i = 0; i < challengers.length; i++) {
          if (challengers[i].profile_token === token) { meIdx = i; break; }
        }
        if (meIdx > 0) {
          var me = challengers.splice(meIdx, 1)[0];
          challengers.unshift(me);
        }
      }

      var grid = document.getElementById('grid');
      challengers.forEach(function(c, idx) {
        grid.appendChild(buildCard(c, idx));
      });

      // Insert ghost card after the viewer's card
      if (token) {
        var meCard = grid.querySelector('.is-me');
        if (meCard) {
          var ghost = buildGhostCard(token);
          meCard.insertAdjacentElement('afterend', ghost);
        }
      }
    })
    .catch(function() {
      showMsg("Couldn\u2019t load the community right now. Try refreshing.");
    });

  function buildCard(c, idx) {
    var isMe = c.profile_token === token;
    var card = document.createElement('div');
    card.className = 'card' + (isMe ? ' is-me' : '');

    var videoId = extractVideoId(c.first_drop_url);
    var hasVideo = !!videoId;

    var videoHtml = '<div class="card-video">';
    videoHtml += '<div class="cohort-chip">C01</div>';
    if (hasVideo) {
      videoHtml += '<img src="https://img.youtube.com/vi/' + videoId + '/hqdefault.jpg" alt="' + esc(c.first_name) + '\'s first drop" loading="lazy">';
      videoHtml += '<div class="play-btn"></div>';
    }
    videoHtml += '</div>';

    var locationParts = [];
    if (c.city) locationParts.push(c.city);
    if (c.state) locationParts.push(c.state);
    var locationStr = locationParts.join(', ');

    var bodyHtml = '<div class="card-body">';
    bodyHtml += '<div class="card-name">' + esc(c.first_name) + (c.last_initial ? ' ' + esc(c.last_initial) + '.' : '') + '</div>';
    if (c.passion) {
      bodyHtml += '<div class="card-passion">' + esc(c.passion) + '</div>';
    }
    if (locationStr) {
      bodyHtml += '<span class="card-location">' + esc(locationStr) + '</span>';
    }
    bodyHtml += '<div class="card-bottom">';
    if (c.champion_first_name) {
      bodyHtml += '<span class="card-champion">w/ ' + esc(c.champion_first_name) + '</span>';
    }
    bodyHtml += '<span class="card-number">No. ' + (idx + 1) + '</span>';
    bodyHtml += '</div></div>';

    card.innerHTML = videoHtml + bodyHtml;

    if (hasVideo) {
      card.style.cursor = 'pointer';
      card.addEventListener('click', function() {
        window.open(c.first_drop_url, '_blank');
      });
    }

    return card;
  }

  function buildGhostCard(viewerToken) {
    var card = document.createElement('div');
    card.className = 'card ghost-card';
    card.innerHTML =
      '<div class="ghost-video"><div class="ghost-video-inner">' +
        '<div class="ghost-plus">+1</div>' +
        '<div class="ghost-title">Your seat to give</div>' +
        '<div class="ghost-desc">You hold one invitation. Spend it well.</div>' +
      '</div></div>' +
      '<div class="ghost-body">' +
        '<button class="ghost-btn">Send your +1</button>' +
      '</div>';

    var btn = card.querySelector('.ghost-btn');
    var shareUrl = 'https://thelearningchallenge.org/apply?ref=' + encodeURIComponent(viewerToken);

    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (navigator.share) {
        navigator.share({
          title: 'The Learning Challenge',
          text: "I get one sponsorship this summer \u2014 I\u2019m using it on you. Come build something.",
          url: shareUrl
        }).catch(function() {});
      } else {
        navigator.clipboard.writeText(shareUrl).then(function() {
          btn.textContent = 'Link copied!';
          setTimeout(function() { btn.textContent = 'Send your +1'; }, 2000);
        }).catch(function() {});
      }
    });

    return card;
  }

  function extractVideoId(url) {
    if (!url) return null;
    var m = url.match(/(?:youtube\.com\/(?:watch\?.*v=|shorts\/)|youtu\.be\/)([\w-]{11})/);
    return m ? m[1] : null;
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function showMsg(text) {
    var el = document.getElementById('msg');
    el.textContent = text;
    el.style.display = 'block';
    document.getElementById('subtitle').textContent = '';
    document.getElementById('count').textContent = '';
  }
})();
</script>

</body>
</html>
