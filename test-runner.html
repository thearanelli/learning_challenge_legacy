<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#001722;--navy2:#0a2230;--navy3:#0f2d40;
  --orange:#EA5329;--amber:#F79227;--white:#F5F5F0;
  --muted:rgba(245,245,240,0.45);--border:rgba(255,255,255,0.07);
  --green:#1D9E75;--red:#E24B4A;--yellow:#EF9F27;
  --mono:'JetBrains Mono',monospace;--sans:'Anton',sans-serif;
}
body{background:var(--navy);color:var(--white);font-family:var(--sans);min-height:100vh;font-size:13px}
.app{display:flex;flex-direction:column;min-height:100vh}
.keys-panel{background:var(--navy2);border-bottom:1px solid var(--border);padding:12px 20px}
.keys-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.keys-toggle:hover{color:var(--white)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--red);transition:background .2s}
.dot.connected{background:var(--green)}
.keys-grid{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.keys-grid.open{display:grid}
.key-field label{display:block;font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.key-field input{width:100%;background:var(--navy3);border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--white);font-family:var(--mono);font-size:11px;outline:none}
.key-field input:focus{border-color:var(--orange)}
.keys-actions{display:flex;gap:8px;margin-top:10px}
.btn{font-family:var(--sans);font-size:12px;font-weight:600;padding:7px 16px;border-radius:6px;border:none;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-orange{background:var(--orange);color:white}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{color:var(--white);border-color:rgba(255,255,255,.2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.main{display:flex;flex:1}
.sidebar{width:220px;min-width:220px;background:var(--navy2);border-right:1px solid var(--border);padding:16px 0}
.sidebar-label{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;padding:0 16px;margin-bottom:10px}
.stage-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 16px;background:none;border:none;cursor:pointer;color:var(--muted);font-family:var(--sans);font-size:12px;text-align:left;transition:all .15s;border-left:2px solid transparent}
.stage-btn:hover{color:var(--white);background:rgba(255,255,255,.03)}
.stage-btn.active{color:var(--white);border-left-color:var(--orange);background:rgba(234,83,41,.08)}
.stage-btn.running{color:var(--amber)}
.stage-btn.pass{color:var(--green)}
.stage-btn.fail{color:var(--red)}
.stage-icon{font-size:14px;width:18px;text-align:center}
.stage-status{margin-left:auto;font-size:10px;font-family:var(--mono)}
.sidebar-divider{height:1px;background:var(--border);margin:8px 16px}
.run-all-btn{margin:12px 16px 0;width:calc(100% - 32px);background:var(--orange);color:white;font-family:var(--sans);font-size:12px;font-weight:700;padding:10px;border-radius:8px;border:none;cursor:pointer;transition:opacity .15s}
.run-all-btn:hover{opacity:.85}
.run-all-btn:disabled{opacity:.35;cursor:not-allowed}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.content-header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.content-title{font-size:16px;font-weight:700}
.content-sub{font-size:11px;color:var(--muted);margin-top:2px}
.header-actions{display:flex;gap:8px;align-items:center}
.results-area{flex:1;overflow-y:auto;padding:20px 24px;font-family:var(--mono);font-size:12px;line-height:1.8}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);text-align:center;gap:8px}
.empty-icon{font-size:32px;opacity:.4}
.empty-title{font-family:var(--sans);font-size:14px;color:var(--muted)}
.empty-sub{font-size:11px}
.result-group-title{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);margin-top:16px}
.result-group-title:first-child{margin-top:0}
.assertion{display:flex;align-items:flex-start;gap:10px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.assertion-icon{font-size:12px;margin-top:1px;flex-shrink:0}
.assertion-icon.pass{color:var(--green)}
.assertion-icon.fail{color:var(--red)}
.assertion-icon.warn{color:var(--yellow)}
.assertion-icon.info{color:var(--muted)}
.assertion-text{color:var(--white)}
.assertion-detail{color:var(--muted);font-size:11px}
.spinner{display:inline-block;width:10px;height:10px;border:1.5px solid var(--amber);border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.summary-bar{padding:8px 24px;background:var(--navy3);border-top:1px solid var(--border);display:flex;align-items:center;gap:16px;font-size:11px}
.summary-pill{padding:3px 10px;border-radius:100px;font-weight:600;font-size:10px}
.summary-pill.pass{background:rgba(29,158,117,.15);color:var(--green)}
.summary-pill.fail{background:rgba(226,75,74,.15);color:var(--red)}
.summary-pill.warn{background:rgba(239,159,39,.15);color:var(--yellow)}
.summary-time{color:var(--muted);margin-left:auto}
.send-panel{border-top:1px solid var(--border);background:var(--navy2);padding:12px 24px;display:flex;align-items:center;gap:12px}
.send-label{font-size:11px;color:var(--muted);flex:1}
.send-btn{background:var(--orange);color:white;font-family:var(--sans);font-size:12px;font-weight:700;padding:8px 18px;border-radius:6px;border:none;cursor:pointer}
.send-btn:hover{opacity:.85}
</style>
</head>
<body>
<div class="app">
  <div class="keys-panel">
    <div class="keys-toggle" onclick="toggleKeys()">
      <div class="dot" id="conn-dot"></div>
      <span id="conn-label">API Keys — click to configure</span>
      <span style="margin-left:auto;font-size:10px" id="keys-chevron">▼</span>
    </div>
    <div class="keys-grid" id="keys-grid">
      <div class="key-field"><label>Supabase URL</label><input type="text" id="k-url" placeholder="https://xxx.supabase.co"></div>
      <div class="key-field"><label>Service Role Key</label><input type="password" id="k-service" placeholder="eyJ..."></div>
      <div class="key-field"><label>Anon Key</label><input type="password" id="k-anon" placeholder="eyJ..."></div>
      <div class="key-field"><label>Resend API Key</label><input type="password" id="k-resend" placeholder="re_..."></div>
      <div class="key-field"><label>BoldSign API Key</label><input type="password" id="k-boldsign" placeholder="..."></div>
      <div class="key-field"><label>Tremendous API Key</label><input type="password" id="k-tremendous" placeholder="..."></div>
      <div class="key-field"><label>Vercel Base URL</label><input type="text" id="k-vercel" placeholder="https://learning-challenge-legacy.vercel.app"></div>
      <div class="key-field"><label>Staff Email</label><input type="text" id="k-staff" placeholder="thea@griptape.org"></div>
    </div>
    <div class="keys-actions" id="keys-actions" style="display:none">
      <button class="btn btn-orange" onclick="saveKeys()">Connect</button>
      <button class="btn btn-ghost" onclick="clearKeys()">Clear</button>
    </div>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-label">Test Stages</div>
      <button class="stage-btn active" id="btn-screening" onclick="selectStage('screening')"><span class="stage-icon">📋</span>Screening<span class="stage-status" id="ss-screening"></span></button>
      <button class="stage-btn" id="btn-declaration" onclick="selectStage('declaration')"><span class="stage-icon">✍️</span>Declaration<span class="stage-status" id="ss-declaration"></span></button>
      <button class="stage-btn" id="btn-video" onclick="selectStage('video')"><span class="stage-icon">🎬</span>First Drop<span class="stage-status" id="ss-video"></span></button>
      <button class="stage-btn" id="btn-champion" onclick="selectStage('champion')"><span class="stage-icon">🤝</span>Champion Match<span class="stage-status" id="ss-champion"></span></button>
      <button class="stage-btn" id="btn-orientation" onclick="selectStage('orientation')"><span class="stage-icon">📞</span>Orientation<span class="stage-status" id="ss-orientation"></span></button>
      <button class="stage-btn" id="btn-grant" onclick="selectStage('grant')"><span class="stage-icon">💰</span>Grant<span class="stage-status" id="ss-grant"></span></button>
      <button class="stage-btn" id="btn-grant-expired" onclick="selectStage('grant-expired')"><span class="stage-icon">⏰</span>Grant Expired<span class="stage-status" id="ss-grant-expired"></span></button>
      <button class="stage-btn" id="btn-fullsend" onclick="selectStage('fullsend')"><span class="stage-icon">🚀</span>Full Send<span class="stage-status" id="ss-fullsend"></span></button>
      <div class="sidebar-divider"></div>
      <button class="run-all-btn" onclick="runAll()">▶ Run All Tests</button>
    </div>

    <div class="content">
      <div class="content-header">
        <div>
          <div class="content-title" id="stage-title">Screening</div>
          <div class="content-sub" id="stage-sub">Tests AI screening → declaration_pending transition</div>
        </div>
        <div class="header-actions">
          <button class="btn btn-ghost" id="cleanup-btn" onclick="cleanupCurrent()" style="display:none">🗑 Cleanup</button>
          <button class="btn btn-orange" id="run-btn" onclick="runCurrentStage()">▶ Run Test</button>
        </div>
      </div>

      <div class="results-area" id="results-area">
        <div class="empty-state">
          <div class="empty-icon">⚡</div>
          <div class="empty-title">Ready to test</div>
          <div class="empty-sub">Configure API keys then click Run Test</div>
        </div>
      </div>

      <div class="summary-bar" id="summary-bar" style="display:none">
        <span id="sum-pass" class="summary-pill pass"></span>
        <span id="sum-fail" class="summary-pill fail" style="display:none"></span>
        <span id="sum-warn" class="summary-pill warn" style="display:none"></span>
        <span class="summary-time" id="sum-time"></span>
      </div>

      <div class="send-panel" id="send-panel" style="display:none">
        <div class="send-label" id="send-label">Test complete — send results to Claude for analysis</div>
        <button class="send-btn" id="send-btn" onclick="sendResultsToClaude()">Send to Claude →</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── DEV CONFIG — fill these in once, leave blank for production ──
const DEV_KEYS = {
  url: 'https://bqysrqjywxdmvcmxxrui.supabase.co',
  service: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxeXNycWp5d3hkbXZjbXh4cnVpIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NTIzMjg0MSwiZXhwIjoyMDkwODA4ODQxfQ.TBFzU5zruwLJvzeAKMTjDUuGan2XzNiBGOnOWy4eXDA',
  anon: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxeXNycWp5d3hkbXZjbXh4cnVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMzI4NDEsImV4cCI6MjA5MDgwODg0MX0.Ex681NJ3h_SBLLojJANrRmcdbDS7FoMB4lMw4EsNZeQ',
  resend: 're_5sQ5zhhm_6dn9cjkwjM8GYRUKTksgshqB',
  boldsign: 'YmU3NjY0NzItMTkxMy00ZjFmLThiNjktOWU0ZjlkYzY0NGU0',
  tremendous: 'TEST_KSYPxMaYW--rgyMI6g4cVTH7FGcnf6EVm2Pd8oWxbO3',
  vercel: 'https://learning-challenge-legacy.vercel.app',
  staff: 'thea@griptape.org',
};

let keys={};
let keysOpen=false;
let currentStage='screening';
let isRunning=false;
let testRecords={};
let lastResults=null;

const STAGE_META={
  screening:{title:'Screening',sub:'Tests AI screening → declaration_pending transition'},
  declaration:{title:'Declaration',sub:'Tests declaration form → video_pending'},
  video:{title:'First Drop',sub:'Tests video submission → video_review'},
  champion:{title:'Champion Match',sub:'Tests acceptance → youth row → champion match → intro email'},
  orientation:{title:'Orientation',sub:'Tests orientation form → grant_pending'},
  grant:{title:'Grant Approval',sub:'Tests grant_review → grant_approved → Tremendous'},
  'grant-expired':{title:'Grant Expired',sub:'Tests grant_pending → grant_expired after 21 days (TEST_MODE)'},
  fullsend:{title:'Full Send',sub:'Tests grant_approved/expired → final_video_pending (TEST_MODE)'},
};

function toggleKeys(){
  keysOpen=!keysOpen;
  document.getElementById('keys-grid').classList.toggle('open',keysOpen);
  document.getElementById('keys-actions').style.display=keysOpen?'flex':'none';
  document.getElementById('keys-chevron').textContent=keysOpen?'▲':'▼';
}
function saveKeys(){
  keys={
    url:document.getElementById('k-url').value.trim(),
    service:document.getElementById('k-service').value.trim(),
    anon:document.getElementById('k-anon').value.trim(),
    resend:document.getElementById('k-resend').value.trim(),
    boldsign:document.getElementById('k-boldsign').value.trim(),
    tremendous:document.getElementById('k-tremendous').value.trim(),
    vercel:document.getElementById('k-vercel').value.trim()||'https://learning-challenge-legacy.vercel.app',
    staff:document.getElementById('k-staff').value.trim(),
  };
  const ok=keys.url&&keys.service;
  document.getElementById('conn-dot').className='dot'+(ok?' connected':'');
  document.getElementById('conn-label').textContent=ok?`Connected — ${keys.url.replace('https://','').split('.')[0]}`:'API Keys — click to configure';
  if(ok)toggleKeys();
}
function clearKeys(){
  keys={};
  ['k-url','k-service','k-anon','k-resend','k-boldsign','k-tremendous','k-vercel','k-staff'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('conn-dot').className='dot';
  document.getElementById('conn-label').textContent='API Keys — click to configure';
}

async function sb(path,opts={}){
  const authKey=keys.service||keys.anon;
  const r=await fetch(`${keys.url}/rest/v1/${path}`,{
    headers:{'apikey':authKey,'Authorization':`Bearer ${authKey}`,'Content-Type':'application/json','Prefer':'return=representation',...(opts.headers||{})},
    ...opts
  });
  const t=await r.text();
  try{return{ok:r.ok,status:r.status,data:JSON.parse(t)}}
  catch{return{ok:r.ok,status:r.status,data:t}}
}
async function sbGet(table,qs=''){return sb(`${table}?${qs}`)}
async function sbPost(table,row){return sb(table,{method:'POST',body:JSON.stringify(row)})}
async function sbPatch(table,qs,data){return sb(`${table}?${qs}`,{method:'PATCH',body:JSON.stringify(data)})}
async function sbDel(table,qs){return sb(`${table}?${qs}`,{method:'DELETE'})}
async function edgeFn(name,body){
  const r=await fetch(`${keys.vercel}/api/proxy`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({url:`${keys.url}/functions/v1/${name}`,body})
  });
  const t=await r.text();
  try{return{ok:r.ok,status:r.status,data:JSON.parse(t)}}
  catch{return{ok:r.ok,status:r.status,data:t}}
}
async function vercelPost(path,body){
  const r=await fetch(`${keys.vercel}${path}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const t=await r.text();
  try{return{ok:r.ok,status:r.status,data:JSON.parse(t)}}
  catch{return{ok:r.ok,status:r.status,data:t}}
}
async function poll(table,id,field,expected,maxMs=15000){
  const start=Date.now();
  while(Date.now()-start<maxMs){
    await sleep(800);
    const r=await sbGet(table,`id=eq.${id}&select=${field}`);
    if(r.ok&&r.data[0]?.[field]===expected)return true;
  }
  return false;
}
async function checkResend(email){
  if(!keys.resend)return{checked:false};
  try{
    const r=await fetch(`${keys.vercel}/api/proxy`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url:'https://api.resend.com/emails?limit=20',method:'GET',service:'resend'})
    });
    const d=await r.json();
    const match=(d.data||[]).find(e=>e.to?.includes(email));
    return{checked:true,found:!!match,email:match};
  }catch(e){return{checked:false,reason:e.message}}
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

function selectStage(s){
  currentStage=s;
  document.querySelectorAll('.stage-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(`btn-${s}`).classList.add('active');
  document.getElementById('stage-title').textContent=STAGE_META[s].title;
  document.getElementById('stage-sub').textContent=STAGE_META[s].sub;
  document.getElementById('results-area').innerHTML='<div class="empty-state"><div class="empty-icon">⚡</div><div class="empty-title">Ready to test</div><div class="empty-sub">Click Run Test to begin</div></div>';
  document.getElementById('summary-bar').style.display='none';
  document.getElementById('send-panel').style.display='none';
  document.getElementById('cleanup-btn').style.display='none';
}

function grp(txt){
  const area=document.getElementById('results-area');
  const d=document.createElement('div');
  d.className='result-group-title';d.textContent=txt;
  area.appendChild(d);
}
function addRow(icon,text,detail=''){
  const area=document.getElementById('results-area');
  const d=document.createElement('div');d.className='assertion';
  const map={'✓':'pass','✗':'fail','⚠':'warn','→':'info','…':'running'};
  const inner=icon==='…'?'<span class="spinner"></span>':icon;
  d.innerHTML=`<span class="assertion-icon ${map[icon]||'info'}">${inner}</span><div><div class="assertion-text">${text}</div>${detail?`<div class="assertion-detail">${detail}</div>`:''}</div>`;
  area.appendChild(d);area.scrollTop=area.scrollHeight;
  return d;
}
function updRow(el,icon,text,detail=''){
  const map={'✓':'pass','✗':'fail','⚠':'warn','→':'info'};
  el.querySelector('.assertion-icon').className=`assertion-icon ${map[icon]||'info'}`;
  el.querySelector('.assertion-icon').textContent=icon;
  el.querySelector('.assertion-text').textContent=text;
  const det=el.querySelector('.assertion-detail');
  if(det)det.textContent=detail;
  else if(detail)el.querySelector('div').insertAdjacentHTML('beforeend',`<div class="assertion-detail">${detail}</div>`);
}
function finalize(passed,failed,warned,ms,assertions){
  lastResults={stage:currentStage,title:STAGE_META[currentStage].title,passed,failed,warned,ms,assertions,records:testRecords};
  const bar=document.getElementById('summary-bar');bar.style.display='flex';
  document.getElementById('sum-pass').textContent=`✓ ${passed} passed`;
  const fe=document.getElementById('sum-fail'),we=document.getElementById('sum-warn');
  fe.style.display=failed>0?'inline':'none';fe.textContent=`✗ ${failed} failed`;
  we.style.display=warned>0?'inline':'none';we.textContent=`⚠ ${warned} warnings`;
  document.getElementById('sum-time').textContent=`${(ms/1000).toFixed(1)}s`;
  const sp=document.getElementById('send-panel');sp.style.display='flex';
  document.getElementById('send-label').textContent=failed>0?`${failed} failure${failed>1?'s':''} detected — send to Claude for diagnosis`:'All checks passed — send results to Claude';
  document.getElementById('send-btn').textContent=failed>0?'Send failures to Claude →':'Send results to Claude →';
}
function sendResultsToClaude(){
  if(!lastResults)return;
  const r=lastResults;
  const lines=[
    `GRIPTAPE TEST RESULTS — ${r.title}`,
    `Status: ${r.failed>0?'FAIL':r.warned>0?'WARN':'PASS'}`,
    `Time: ${(r.ms/1000).toFixed(1)}s | Passed: ${r.passed} | Failed: ${r.failed} | Warnings: ${r.warned}`,
    `Timestamp: ${new Date().toISOString()}`,
    '',
    'ASSERTIONS:',
    ...r.assertions.map(a=>`${a.icon} ${a.text}${a.detail?' — '+a.detail:''}`),
    '',
    'TEST RECORDS:',
    JSON.stringify(r.records,null,2),
  ];
  if(r.failed>0){
    lines.push('','FAILURES:');
    r.assertions.filter(a=>a.icon==='✗').forEach((a,i)=>{
      lines.push(`${i+1}. ${a.text}`);
      if(a.detail)lines.push(`   Detail: ${a.detail}`);
    });
  }
  if(typeof sendPrompt==='function'){
    sendPrompt(lines.join('\n'));
  } else {
    navigator.clipboard.writeText(lines.join('\n')).then(()=>alert('Results copied to clipboard — paste into Claude'));
  }
}
async function cleanupCurrent(){
  if(testRecords.youthId)await sbDel('youth',`id=eq.${testRecords.youthId}`);
  if(testRecords.appId)await sbDel('applications',`id=eq.${testRecords.appId}`);
  testRecords={};
  document.getElementById('cleanup-btn').style.display='none';
  selectStage(currentStage);
}
async function runCurrentStage(){
  if(!keys.url||!keys.service){alert('Configure and connect API keys first.');toggleKeys();return;}
  if(isRunning)return;
  isRunning=true;testRecords={};
  document.getElementById('run-btn').disabled=true;
  document.getElementById('run-btn').textContent='⏳ Running...';
  document.getElementById(`btn-${currentStage}`).classList.add('running');
  document.getElementById('results-area').innerHTML='';
  document.getElementById('summary-bar').style.display='none';
  document.getElementById('send-panel').style.display='none';
  const assertions=[];
  let passed=0,failed=0,warned=0;
  const start=Date.now();
  function ok(text,detail=''){passed++;const r={icon:'✓',text,detail};assertions.push(r);addRow('✓',text,detail);}
  function fail(text,detail=''){failed++;const r={icon:'✗',text,detail};assertions.push(r);addRow('✗',text,detail);}
  function warn(text,detail=''){warned++;const r={icon:'⚠',text,detail};assertions.push(r);addRow('⚠',text,detail);}
  function info(text,detail=''){const r={icon:'→',text,detail};assertions.push(r);addRow('→',text,detail);}
  try{
    switch(currentStage){
      case 'screening':     await runScreening(ok,fail,warn,info);break;
      case 'declaration':   await runDeclaration(ok,fail,warn,info);break;
      case 'video':         await runVideo(ok,fail,warn,info);break;
      case 'champion':      await runChampion(ok,fail,warn,info);break;
      case 'orientation':   await runOrientation(ok,fail,warn,info);break;
      case 'grant':         await runGrant(ok,fail,warn,info);break;
      case 'grant-expired': await runGrantExpired(ok,fail,warn,info);break;
      case 'fullsend':      await runFullSend(ok,fail,warn,info);break;
    }
  }catch(e){fail('Unexpected error',e.message);}
  const elapsed=Date.now()-start;
  finalize(passed,failed,warned,elapsed,assertions);
  document.getElementById(`ss-${currentStage}`).textContent=failed>0?'✗':warned>0?'⚠':'✓';
  document.getElementById(`btn-${currentStage}`).classList.remove('running');
  document.getElementById(`btn-${currentStage}`).classList.add(failed>0?'fail':'pass');
  if(testRecords.appId||testRecords.youthId)document.getElementById('cleanup-btn').style.display='inline-block';
  isRunning=false;
  document.getElementById('run-btn').disabled=false;
  document.getElementById('run-btn').textContent='▶ Run Test';
}

async function runScreening(ok,fail,warn,info){
  grp('1 — Insert test application');
  const app={program_id:null,first_name:'Jordan',last_name:'Rivera',birthdate:'06/15/2009',email:'thea@griptape.org',phone:'+12125550100',street_address:'123 Test St',city:'New York',state:'NY',zip:'10001',screening_status:'submitted',sms_consent:false,notify_after:new Date().toISOString(),application_responses:{age:'16',passion:'I want to build a mobile app that helps teenagers track their mental health and connect with peers who share similar experiences. This matters to me because I struggled with anxiety in high school and found no tools designed for teens like me.',why_join:'I want GripTape to back me because I have the idea but not the resources to build it.'}};
  const el=addRow('…','Inserting test application...');
  const ins=await sbPost('applications',app);
  if(!ins.ok||!ins.data[0]?.id){updRow(el,'✗','Insert failed',JSON.stringify(ins.data));fail('Application insert');return;}
  const id=ins.data[0].id;testRecords.appId=id;
  updRow(el,'✓',`Application inserted`,`id: ${id.slice(0,8)}...`);
  grp('2 — Wait for AI screening (max 15s)');
  const pollEl=addRow('…','Polling for declaration_pending...');
  const advanced=await poll('applications',id,'screening_status','declaration_pending',15000);
  if(!advanced){const chk=await sbGet('applications',`id=eq.${id}&select=screening_status,ai_decision`);const cur=chk.data[0];updRow(pollEl,'✗','Did not advance',`Current: ${cur?.screening_status}`);fail('Status advance to declaration_pending',cur?.screening_status);return;}
  updRow(pollEl,'✓','Status → declaration_pending');

  grp('2b — Set notify_after to past so scheduler fires immediately');
  const pastTime = new Date(Date.now() - 3*60*60*1000).toISOString();
  await sbPatch('applications',`id=eq.${id}`,{notify_after:pastTime});

  grp('2c — Trigger scheduler TEST_MODE');
  try{
    const schedEl=addRow('…','Calling daily-scheduler with test_mode:true...');
    const schedR=await edgeFn('daily-scheduler',{test_mode:true});
    schedR.ok?updRow(schedEl,'✓',`Scheduler fired (${schedR.status})`):updRow(schedEl,'⚠',`Scheduler returned ${schedR.status}`);
    await sleep(4000);
  }catch(e){warn('Scheduler trigger failed',e.message);}

  grp('3 — Verify fields');
  const res=await sbGet('applications',`id=eq.${id}&select=*`);const a=res.data[0];
  a?.access_token?ok('access_token set',a.access_token.slice(0,12)+'...'):fail('access_token set');
  a?.stage_deadline_at?ok('stage_deadline_at set',a.stage_deadline_at):fail('stage_deadline_at');
  a?.profile_token?ok('profile_token set'):warn('profile_token not set');
  a?.ai_decision?ok('ai_decision recorded',a.ai_decision):warn('ai_decision not recorded');
  a?.notify_after?ok('notify_after set to past',a.notify_after):warn('notify_after not set');
  grp('4 — Comms log');
  const comms=await sbGet('comms_log',`application_id=eq.${id}&select=*`);
  comms.data?.length>0?ok(`comms_log entries`,`${comms.data.length} entries — ${comms.data.map(c=>c.stage_key).join(', ')}`):fail('comms_log entries','declaration_pending entry','none found');
  grp('5 — Resend');
  if(keys.resend){const r=await checkResend('thea@griptape.org');r.found?ok('Resend email found'):warn('Not in recent Resend logs');}
  else warn('No Resend key');
}
