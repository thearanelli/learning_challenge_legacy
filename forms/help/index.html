<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Get Help — GripTape Learning Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #001722;
      --orange: #EA5329;
      --amber: #F79227;
      --white: #F5F5F0;
      --muted: rgba(245,245,240,0.5);
      --border: rgba(255,255,255,0.07);
      --input-bg: #0a2230;
      --input-border: rgba(255,255,255,0.12);
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    .page {
      max-width: 680px;
      margin: 0 auto;
      padding: 32px 1.5rem 64px;
    }

    .page-logo {
      display: block;
      margin: 0 auto 24px;
      height: 48px;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0 0 28px;
    }

    h1 {
      font-family: 'Anton', sans-serif;
      font-weight: 800;
      font-size: 1.8rem;
      color: var(--orange);
      margin: 0 0 8px;
      line-height: 1.15;
    }

    .subtext {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
      margin: 0 0 8px;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--white);
    }

    .hint {
      display: block;
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--muted);
      margin-top: 3px;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      margin-top: 8px;
      padding: 1rem;
      font-size: 1rem;
      font-family: 'DM Sans', sans-serif;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      color: var(--white);
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      border-color: var(--orange);
    }

    input[type="text"]::placeholder,
    textarea::placeholder {
      color: var(--muted);
    }

    select option {
      background: #0a2230;
      color: var(--white);
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button[type="submit"] {
      margin-top: 24px;
      width: 100%;
      padding: 1rem;
      font-family: 'Anton', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button[type="submit"]:hover:not(:disabled) { opacity: 0.88; }
    button[type="submit"]:disabled { opacity: 0.45; cursor: not-allowed; }

    #status {
      margin-top: 16px;
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .error { color: #FF5C5C; }
    .success { color: #4ade80; }
  </style>
</head>
<body>

  <div class="page">

    <img class="page-logo"
      src="https://cdn.prod.website-files.com/640b7fef2e2b16effc0a7b1e/644b0baddf9bc8c57b2514ca_GripTape_wordmark_white.png"
      alt="GripTape" />

    <hr class="divider" />

    <h1>Need help?</h1>
    <p class="subtext">Fill out the form below and Thea will get back to you shortly.</p>

    <form id="help-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required />

      <label for="contact">
        Email or phone number
        <span class="hint">We'll use this to get back to you</span>
      </label>
      <input type="text" id="contact" name="contact" required />

      <label for="role">I am a…</label>
      <select id="role" name="role" required>
        <option value="">— select —</option>
        <option value="Youth in the program">Youth in the program</option>
        <option value="Champion (mentor)">Champion (mentor)</option>
      </select>

      <label for="message">How can we help?</label>
      <textarea id="message" name="message" placeholder="Describe what you need help with" required></textarea>

      <button type="submit" id="submit-btn">Send message</button>
    </form>

    <div id="status"></div>

  </div>

  <script>
    document.getElementById('help-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      var btn    = document.getElementById('submit-btn');
      var status = document.getElementById('status');

      var name    = document.getElementById('name').value.trim();
      var contact = document.getElementById('contact').value.trim();
      var role    = document.getElementById('role').value;
      var message = document.getElementById('message').value.trim();

      btn.disabled    = true;
      btn.textContent = 'Sending…';
      status.textContent = '';
      status.className   = '';

      try {
        var res  = await fetch('/api/help-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, contact, role, message }),
        });
        var data = await res.json();

        if (data.success) {
          document.getElementById('help-form').reset();
          status.textContent = 'We got your message. Thea will be in touch with you shortly.';
          status.className   = 'success';
        } else {
          status.textContent = 'Something went wrong. Please email thea@griptape.org directly.';
          status.className   = 'error';
        }
      } catch {
        status.textContent = 'Something went wrong. Please email thea@griptape.org directly.';
        status.className   = 'error';
      }

      btn.disabled    = false;
      btn.textContent = 'Send message';
    });
  </script>
</body>
</html>
